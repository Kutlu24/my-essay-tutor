services:
  - type: web
    name: my-essay-tutor
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn my_essay_tutor.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GRADING_PROVIDER
        value: glm
      - key: OCR_PROVIDER
        value: gemini
      - key: GLM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
