services:
  - type: web
    name: my-essay-tutor
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn my_essay_tutor.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GRADING_PROVIDER
        value: glm
      - key: GLM_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: HF_TROCR_MODEL
        value: microsoft/trocr-large-handwritten
